<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="#fde98a"/>
  
  <!-- Outer triangle -->
  <polygon points="256,30 490,410 22,410" fill="none" stroke="#e8a020" stroke-width="20" stroke-linejoin="round"/>
  
  <!-- Top inner triangle pointing UP -->
  <polygon points="256,30 154,220 358,220" fill="none" stroke="#e8a020" stroke-width="16" stroke-linejoin="round"/>
  
  <!-- Bottom-left inner triangle pointing UP -->
  <polygon points="154,220 22,410 256,410" fill="none" stroke="#e8a020" stroke-width="16" stroke-linejoin="round"/>
  
  <!-- Bottom-right inner triangle pointing UP -->
  <polygon points="358,220 256,410 490,410" fill="none" stroke="#e8a020" stroke-width="16" stroke-linejoin="round"/>

  <!-- TAOM Daily Light in one single line -->
  <text x="256" y="478"
    font-family="Times New Roman, serif"
    font-weight="bold"
    font-size="52"
    text-anchor="middle">
    <tspan fill="#1a3a8f">TAOM </tspan><tspan fill="#7a3010">Daily Light</tspan>
  </text>
</svg>
